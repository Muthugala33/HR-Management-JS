<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">HR Management System</h1>
        
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-5 rounded">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="#addEmployeeSection">Add Employee</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#searchEmployeeSection">Search Employee</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#updateEmployeeSection">Update Employee</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#deleteEmployeeSection">Delete Employee</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <div id="addEmployeeSection" class="form-section">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h3>Add Employee</h3>
                </div>
                <div class="card-body">
                    <form id="addEmployeeForm">
                        </div>
                        <div class="mb-3">
                            <label for="addName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="addName" required>
                        </div>
                        <div class="mb-3">
                            <label for="addEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="addEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="addDepartment" class="form-label">Department</label>
                            <input type="text" class="form-control" id="addDepartment" required>
                        </div>
                        <button type="submit" class="btn btn-success">Add Employee</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div id="searchEmployeeSection" class="form-section">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h3>Search Employee</h3>
                </div>
                <div class="card-body">
                    <form id="searchEmployeeForm">
                        <div class="mb-3">
                            <label for="searchId" class="form-label">Search by ID</label>
                            <input type="text" class="form-control" id="searchId" required>
                        </div>
                        <button type="submit" class="btn btn-info">Search</button>
                    </form>
                    <div id="searchResult" class="mt-4" style="display: none;">
                        <h4>Employee Details</h4>
                        <table class="table table-bordered">
                            <tbody>
                                <tr>
                                    <th>ID</th>
                                    <td id="searchResultId"></td>
                                </tr>
                                <tr>
                                    <th>Name</th>
                                    <td id="searchResultName"></td>
                                </tr>
                                <tr>
                                    <th>Email</th>
                                    <td id="searchResultEmail"></td>
                                </tr>
                                <tr>
                                    <th>Department</th>
                                    <td id="searchResultDepartment"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="updateEmployeeSection" class="form-section">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h3>Update Employee</h3>
                </div>
                <div class="card-body">
                    <form id="updateEmployeeForm">
                        <div class="mb-3">
                            <label for="updateId" class="form-label">Employee ID</label>
                            <input type="text" class="form-control" id="updateId" required>
                        </div>
                        <div class="mb-3">
                            <label for="updateName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="updateName" required>
                        </div>
                        <div class="mb-3">
                            <label for="updateEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="updateEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="updateDepartment" class="form-label">Department</label>
                            <input type="text" class="form-control" id="updateDepartment" required>
                        </div>
                        <button type="submit" class="btn btn-warning">Update Employee</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div id="deleteEmployeeSection" class="form-section">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3>Delete Employee</h3>
                </div>
                <div class="card-body">
                    <form id="deleteEmployeeForm">
                        <div class="mb-3">
                            <label for="deleteId" class="form-label">Employee ID</label>
                            <input type="text" class="form-control" id="deleteId" required>
                        </div>
                        <button type="submit" class="btn btn-danger">Delete Employee</button>
                    </form>
                    <div id="deleteResult" class="mt-4 alert" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
